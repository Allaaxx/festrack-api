name: Deploy

on:
    push:
        branches:
            - master

jobs:
    check:
        runs-on: ubuntu-latest

        steps:
            - name: Checkout code
              uses: actions/checkout@v6

            - name: Setup Node
              uses: actions/setup-node@v6
              with:
                  node-version: '24'

            - name: Setup .env.test
              run: echo "DATABASE_URL=postgresql://postgres:password@localhost:5433/finance-app" >> .env.test

            - name: Install Dependencies
              run: npm ci

            - name: ESLint
              run: npm run eslint:check

            - name: Prettier
              run: npm run prettier:check

            - name: Jest
              run: npm run test

    migrate:
        runs-on: ubuntu-latest
        needs: check
        environment: production

        steps:
            - name: Checkout code
              uses: actions/checkout@v6

            - name: Setup Node
              uses: actions/setup-node@v6
              with:
                  node-version: '24'

            - name: Install Dependencies
              run: npm ci

            - name: Make envfile
              uses: SpicyPizza/create-envfile@v2
              with:
                  envkey_DATABASE_URL: ${{ secrets.DATABASE_URL }}

            - name: Prisma migrate
              run: npx prisma migrate deploy

    deploy:
        runs-on: ubuntu-latest
        needs: migrate
        environment: production
        steps:
            - name: Checkout code
              uses: actions/checkout@v6

            - name: Deploy
              run: |
                  curl "${{ secrets.RENDER_DEPLOY_HOOK_URL}}"
