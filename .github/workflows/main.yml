name: Deploy

on:
    push:
        branches:
            - master

jobs:
    check:
        runs-on: ubuntu-latest

        steps:
            - name: Checkout code
              uses: actions/checkout@v6

            - name: Setup Bun
              uses: oven-sh/setup-bun@v2

            - name: Setup .env.test
              run: |
                  echo "DATABASE_URL=postgresql://postgres:password@localhost:5433/finance-app" >> .env.test
                  echo "JWT_ACCESS_TOKEN_SECRET=test_access_secret" >> .env.test
                  echo "JWT_REFRESH_TOKEN_SECRET=test_refresh_secret" >> .env.test

            - name: Install Dependencies
              run: bun install --frozen-lockfile

            - name: ESLint
              run: bun run eslint:check

            - name: Prettier
              run: bun run prettier:check

            - name: Run Tests
              run: bun test

    migrate:
        runs-on: ubuntu-latest
        needs: check
        environment: production

        steps:
            - name: Checkout code
              uses: actions/checkout@v6

            - name: Setup Bun
              uses: oven-sh/setup-bun@v2

            - name: Install Dependencies
              run: bun install --frozen-lockfile

            - name: Make envfile
              uses: SpicyPizza/create-envfile@v2
              with:
                  envkey_DATABASE_URL: ${{ secrets.DATABASE_URL }}

            - name: Drizzle migrate
              run: bunx drizzle-kit migrate

    deploy:
        runs-on: ubuntu-latest
        needs: migrate
        environment: production
        steps:
            - name: Checkout code
              uses: actions/checkout@v6

            - name: Deploy
              run: |
                  curl "${{ secrets.RENDER_DEPLOY_HOOK_URL}}"
