name: finance-app-api

services:
    postgres:
        image: postgres
        container_name: finance-app-postgres
        environment:
            POSTGRES_PASSWORD: password
            POSTGRES_USER: postgres
            POSTGRES_DB: finance-app
        ports:
            - '5432:5432'
        volumes:
            - ./.postgres-data:/var/lib/postgresql

    postgres-test:
        image: postgres
        container_name: finance-app-postgres-test
        environment:
            POSTGRES_PASSWORD: password
            POSTGRES_USER: postgres
            POSTGRES_DB: finance-app
        ports:
            - '5433:5432'
        healthcheck:
            test: ['CMD-SHELL', 'pg_isready -U postgres -d finance-app']
            interval: 1s
            timeout: 5s
            retries: 10

    minio:
        image: minio/minio:latest
        container_name: finance-app-minio
        environment:
            MINIO_ROOT_USER: minioadmin
            MINIO_ROOT_PASSWORD: minioadmin
        command: server /data --console-address ":9001"
        ports:
            - '9000:9000'
            - '9001:9001'
        volumes:
            - ./.minio-data:/data

    minio-create-bucket:
        image: minio/mc:latest
        container_name: finance-app-minio-setup
        depends_on:
            - minio
        entrypoint: >
            /bin/sh -c "
            until /usr/bin/mc alias set localminio http://minio:9000 minioadmin minioadmin; do
                echo 'Waiting for MinIO...';
                sleep 1;
            done;
            /usr/bin/mc mb --ignore-existing localminio/festrack;
            /usr/bin/mc anonymous set download localminio/festrack;
            exit 0;
            "
